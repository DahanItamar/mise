name: validate dotnet install contribution
on:
  push:
    branches: [ci/validate-dotnet-install-path]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      MBX_DISABLE: "1"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_CARGO_BUILD_COMMAND: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev pkg-config shellcheck shfmt
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: dotnet-install-arm
      - name: Apply contribution patch
        env:
          CONTRIBUTION_PATCH: ''
        run: |
          printf '%s' "$CONTRIBUTION_PATCH" | base64 --decode > /tmp/contribution.patch
          git apply --index /tmp/contribution.patch
          git diff --cached --check
      - name: Formatting and shell checks
        run: |
          cargo fmt --all -- --check
          bash -n e2e/core/test_dotnet_install_path
          shellcheck e2e/core/test_dotnet_install_path
          shfmt -d -s -i 2 e2e/core/test_dotnet_install_path
      - name: Prove regression on released mise
        run: |
          mkdir -p target/debug
          curl --fail --location --retry 3 https://github.com/jdx/mise/releases/download/v2026.10.3/mise-v2026.10.3-linux-arm64.tar.gz -o /tmp/mise.tar.gz
          tar -xzf /tmp/mise.tar.gz -C /tmp
          cp /tmp/mise/bin/mise target/debug/mise
          chmod +x target/debug/mise
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
          set +e
          target/debug/mise run --skip-tools test:e2e '^test_dotnet_install_path$' > /tmp/baseline.log 2>&1
          status=$?
          set -e
          cat /tmp/baseline.log
          test "$status" -ne 0
          grep -q 'dotnet SDK 8.0.408 was not found' /tmp/baseline.log
          grep -q '10.0.301' /tmp/baseline.log
      - name: Clippy workspace with all features and targets
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Build changed mise
        run: cargo build --all-features
      - name: SDK unit tests
        run: cargo test --all-features --lib plugins::core::dotnet::tests
      - name: Affected SDK and runtime end-to-end tests
        run: mise run --skip-tools test:e2e '^test_dotnet_install_path$' '^test_dotnet$'
